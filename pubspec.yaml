name: lava_cash
description: >
  LavaCash — app Flutter para operação de lavagem de veículos: busca de
  cliente/veículo, cadastro, atendimento com serviços e pagamento, relatórios
  diário e mensal, e licenciamento por dispositivo. Backend Supabase;
  arquitetura em camadas (domain / data / presentation) com GetX e Either
  (dartz).
publish_to: "none"

version: 1.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  supabase_flutter: ^2.12.0
  functions_client: ^2.5.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  intl: ^0.20.2
  url_launcher: ^6.3.2
  device_info_plus: ^12.3.0
  package_info_plus: ^8.3.0
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  auto_size_text: ^3.0.0
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/launcher_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/launcher_icon.png

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
  assets:
    - assets/stitch/
    - assets/images/
